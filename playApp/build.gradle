plugins {
    id 'com.android.application'
}

// La piste Play a déjà enregistré le versionCode 23.
def playVersionCode = Math.max(24, (System.getenv('GITHUB_RUN_NUMBER') ?: '24').toInteger())

android {
    namespace 'com.chk.coran'
    compileSdk 36

    defaultConfig {
        // Identifiant exclusif à la fiche Google Play ; la version personnelle reste com.chk.coran.
        applicationId 'com.sync30.moncoran'
        minSdk 24
        targetSdk 36
        // Google Play refuse toute réutilisation d'un versionCode déjà enregistré.
        // Minimum 24 ; les workflows suivants augmentent automatiquement ce numéro.
        versionCode = playVersionCode
        versionName "1.0.${playVersionCode}"
    }

    // Réutilise le code et les ressources sans déplacer ni modifier l'application personnelle.
    sourceSets {
        main {
            java.srcDirs = ['../app/src/main/java']
            res.srcDirs = ['../app/src/main/res']
        }
    }

    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
            buildConfigField 'boolean', 'ENABLE_GITHUB_UPDATE', 'false'
        }
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-test'
            buildConfigField 'boolean', 'ENABLE_GITHUB_UPDATE', 'false'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
