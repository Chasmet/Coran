name: Android • build et mise à jour
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coran-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer le SDK Android
        run: |
          manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)
          test -n "$manager"
          "$manager" "platforms;android-34" "build-tools;34.0.0"
      - name: Vérifier les textes, les trois sources audio et la lecture en arrière-plan
        run: |
          python3 scripts/verify_sources.py
          python3 scripts/check_background_audio.py
      - name: Compiler l’APK de test
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coran-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compiler l’APK officiel avec la signature permanente
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/assemble_signed_release.py
      - name: Vérifier l’APK officiel
        if: github.ref == 'refs/heads/main'
        run: |
          sdk_tools="$ANDROID_HOME/build-tools/34.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$sdk_tools/apksigner" verify --verbose "$apk"
          cert=$("$sdk_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = 'aa75ecad34a8e9601ba6b73f841426d9f7b4d388d6137b828b8a4fbbdd6f9766'
          "$sdk_tools/aapt" dump badging "$apk" > apk-info.txt
          grep -F "package: name='com.chk.coran' versionCode='$GITHUB_RUN_NUMBER' versionName='1.0.$GITHUB_RUN_NUMBER'" apk-info.txt
          cp "$apk" coran-release.apk
          hash=$(sha256sum coran-release.apk | cut -d ' ' -f 1)
          printf 'Coran %s\n\nMise à jour automatique depuis les réglages.\n\nSHA256: %s\n' "1.0.$GITHUB_RUN_NUMBER" "$hash" > release-notes.txt
      - name: Publier l’APK officiel dans GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $tag existe déjà."
          else
            gh release create "$tag" coran-release.apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Coran 1.0.$GITHUB_RUN_NUMBER" --notes-file release-notes.txt --latest
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: coran-officiel-${{ github.run_number }}
          path: coran-release.apk
          if-no-files-found: error
