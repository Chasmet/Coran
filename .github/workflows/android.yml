name: Android • build et mise à jour
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer le Gradle wrapper officiel s'il manque
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "chore: ajouter le wrapper Gradle officiel [skip ci]"
              git push origin HEAD:main
            fi
          fi
          chmod +x gradlew
      - name: Vérifier les composants Android SDK
        run: |
          echo "SDK_ROOT=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager introuvable"; exit 1; }
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Vérifier les éditions Quran et les audios FR EN AR
        run: python3 scripts/verify_sources.py
      - name: Vérifier le lecteur complet Android
        run: python3 scripts/check_background_audio.py
      - name: Compiler l'APK de test
        run: ./gradlew --no-daemon assembleDebug
      - name: Vérifier la séparation du canal debug
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "name='com.chk.coran.dev'"
      - uses: actions/upload-artifact@v4
        with:
          name: coran-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Construire une release signée
        id: signed
        env:
          KEYSTORE_BASE64: ${{ secrets.CORAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CORAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CORAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CORAN_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signature permanente absente : configurez les quatre secrets CORAN_KEYSTORE_*. Refus de déclarer une compilation de production réussie sans Release signée."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coran-release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/coran-release.jks"
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test "$CERT" = "8a0d3c5bbb0a62b04b2a098c7b73dc1976358c87820ab3ebe2b5a4cf3ab35776" || { echo "::error::Certificat différent de la clé permanente Coran. Publication refusée."; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "name='com.chk.coran'"
          cp app/build/outputs/apk/release/app-release.apk coran-release.apk
          HASH=$(sha256sum coran-release.apk | awk '{print $1}')
          echo "SHA256: $HASH" > release-notes.txt
          echo "Version: 1.0.${{ github.run_number }}" >> release-notes.txt
          echo "Signature vérifiée, même certificat permanent. Mise à jour intégrée depuis l'application." >> release-notes.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Publier GitHub Release — dernière version
        if: ${{ steps.signed.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ./coran-release.apk \
            --title "Coran 1.0.${{ github.run_number }}" \
            --notes-file release-notes.txt --latest
      - name: Archiver l'APK officiel signé
        if: ${{ steps.signed.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coran-officiel-signe-${{ github.run_number }}
          path: coran-release.apk
          if-no-files-found: error
      - name: Effacer la copie temporaire du keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/coran-release.jks"
